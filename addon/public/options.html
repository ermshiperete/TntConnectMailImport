<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TntConnect Mail Import Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 20px;
      max-width: 600px;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .actions {
      margin-top: 20px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background-color: #007cba;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #005a87;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #007cba;
    }
  </style>
</head>
<body>
  <h1>TntConnect Mail Import Settings</h1>
  <div class="field">
    <label for="databasePath">Database Path and Name</label>
    <input type="text" id="databasePath" placeholder="e.g., C:\TntConnect\Data\TntConnect.mpddb">
  </div>
  <div class="field">
    <label for="dbUser">Database User</label>
    <input type="text" id="dbUser" placeholder="e.g., admin">
  </div>
  <div class="actions">
    <button id="save">Save</button>
  </div>
  <div id="status" class="status"></div>
  <script src="options.js" type="module"></script>
</body>
</html>
